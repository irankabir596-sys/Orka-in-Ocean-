name: Binance RSI Scanner

on:
  schedule:
    - cron: "0,30 * * * *"

  workflow_dispatch:
    inputs:
      force_scan:
        description: "Run a scan now"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: binance-rsi-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BINANCE_BASE_URL: https://api.binance.com
          FORCE_SCAN: ${{ inputs.force_scan || false }}
        run: python bot.py

      - name: Save subscriber state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscribers.json bot_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram subscriber state"
            git push
          fi
